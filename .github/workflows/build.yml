name: Build Proxion.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm proxion.spec
      - name: Smoke test (exe starts the proxy engine)
        run: |
          $p = Start-Process dist\Proxion.exe -ArgumentList "__mitmdump","--version" -PassThru -Wait -RedirectStandardOutput out.txt
          Get-Content out.txt
          if (-not (Select-String -Path out.txt -Pattern "Mitmproxy")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Proxion
          path: dist/Proxion.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Proxion.exe
