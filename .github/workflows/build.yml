name: Build Proxion.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only get what they ask for below.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # signed build provenance (only used on main and tags)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # no token left on disk while packages install

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install (exact versions, hashes checked)
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Build exe
        run: python -m PyInstaller --noconfirm proxion.spec

      - name: Smoke test (exe starts the proxy engine)
        run: |
          Start-Process dist\Proxion.exe -ArgumentList "__mitmdump","--version" -Wait -RedirectStandardOutput out.txt
          Get-Content out.txt
          if (-not (Select-String -Path out.txt -Pattern "Mitmproxy")) { exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Proxion.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Proxion.exe" | Out-File -Encoding ascii dist\Proxion.exe.sha256
          Get-Content dist\Proxion.exe.sha256

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/Proxion.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Proxion
          path: |
            dist/Proxion.exe
            dist/Proxion.exe.sha256

  release:
    # Only tags publish, and only this job can write to the repo.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Proxion
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/Proxion.exe
            dist/Proxion.exe.sha256
