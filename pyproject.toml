[project]
name = "proxion"
version = "0.1.0"
description = "Local proxy that swaps Roblox assets (textures, sounds, meshes) on your own client"
requires-python = ">=3.12"
dependencies = ["mitmproxy>=12,<13"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
proxion = "proxion.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["proxion"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, bandit (security), simplify
select = ["F", "E", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S603",  # subprocess without shell: arguments are built by us, never from configs
    "S607",  # partial executable path ("tasklist", "xdg-open") is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]  # asserts and tmp paths are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
