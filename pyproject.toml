[project]
name = "proxion"
version = "0.1.0"
description = "Local proxy that swaps Roblox assets (textures, sounds, meshes) on your own client"
requires-python = ">=3.11"
dependencies = ["mitmproxy>=11"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
proxion = "proxion.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["proxion"]
